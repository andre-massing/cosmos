[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos"
version = "0.0.1"
description = "CoSMoS: the Continuum Surface Mechanics Simulator"
authors = [
{name = "Andre Massing", email = "andre.massing@ntnu.no"},
{name = "Alessandro Contri", email = "alessandro.contri@ntnu.no"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
tests = ["pytest"]
docs = ["sphinx"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "visual: visualization/image-regression tests",
  "convergence: PDE convergence tests",
  "physical: PDE physical property tests",
]